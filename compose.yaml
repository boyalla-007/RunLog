services:
  runlog:
    build: .
    container_name: runlog-app
    ports:
      - "8080:8080"
    environment:
      SPRING_MONGODB_HOST: mongodb
      SPRING_MONGODB_PORT: 27017
      SPRING_MONGODB_DATABASE: runlog
    depends_on:
      - mongodb

  mongodb:
    image: mongo:9.0
    container_name: runlog-mongodb
    volumes:
      - runlog-data:/data/db

volumes:
  runlog-data: